name: Sync Pinnacle Odds → data/cfb_live.csv

on:
  workflow_dispatch: {}
  schedule:
    # Run once per day at 15:00 UTC (3 PM UTC)
    - cron: "0 15 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and merge odds
        run: node scripts/fetch_odds.mjs

      - name: Commit updated CSV
        run: |
          if git status --porcelain | grep -q 'data/cfb_live.csv'; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add data/cfb_live.csv
            git commit -m "Auto-update cfb_live.csv"
            git push
          else
            echo "No odds changes to commit."
          fi
