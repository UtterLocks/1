<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Utter Locks — CBB</title>
  <meta name="description" content="College Basketball Picks (Utter Locks)" />

  <link rel="preconnect" href="https://a.espncdn.com" crossorigin>
  <link rel="icon" type="image/jpeg" href="assets/utter-locks-logo.jpg" />
  <meta property="og:title" content="Utter Locks — CBB Projections">
  <meta property="og:description" content="Data-driven CBB projections & picks.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root{
      --bg:#0b1020; --bg2:#0f1730; --card:#111a36; --text:#eaf0ff; --muted:#a8b3d0;
      --brand:#ffdc7b; --good:#fff3a6; --shadow:0 10px 30px rgba(0,0,0,.35); --radius:18px;
    }

    *{ box-sizing: border-box }
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell;
      color:var(--text);
      background: radial-gradient(1200px 800px at 10% -20%, var(--bg2), transparent),
                  radial-gradient(1200px 800px at 100% 120%, var(--bg2), transparent),
                  var(--bg);
      padding:28px;
    }

    .shell{ max-width:1100px; margin:0 auto; }
    header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }

    .brand{
      display:flex; align-items:center; gap:12px; padding:10px 14px;
      border-radius:calc(var(--radius) + 6px);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10); box-shadow:var(--shadow);
    }

    .logo-img{ width:28px; height:28px; border-radius:8px; object-fit:cover; }
    .title{ margin:0; font-size:24px; display:inline-flex; gap:10px; align-items:center; }

    .subtitle{ margin:2px 0 0; color:var(--muted); font-size:13px }

    .panel{
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      backdrop-filter: blur(8px);
    }

    .table-wrap{ width:100%; overflow-x:auto; }
    table{ width:100%; border-collapse:collapse; margin-top:10px; min-width:760px; }

    thead th{
      position:sticky; top:0;
      background:rgba(15,23,48,.9);
      color:#fff; font-size:13px; letter-spacing:.3px;
      z-index:1;
      border-bottom:1px solid rgba(255,255,255,.18);
    }

    th, td{
      border-bottom:1px solid rgba(255,255,255,.08);
      padding:10px;
      text-align:center;
      vertical-align:middle;
    }

    tbody tr:nth-child(odd){ background:rgba(255,255,255,.02); }
    tbody tr:hover{ background:rgba(255,220,123,.08); }

    .teams{ display:inline-grid; grid-template-columns:1fr; gap:6px; text-align:left; }
    .team{ display:flex; gap:8px; }

    .muted{ color:var(--muted); }
    .num{ white-space:nowrap; }

    /* ⭐ A-GRADE glow */
    .a-grade {
      color:var(--brand);
      font-weight:700;
      text-shadow:0 0 10px rgba(255,220,123,.55);
    }

    footer{
      text-align:center; margin-top:14px;
      color:var(--muted); font-size:12px;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FGSY9FNSQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7FGSY9FNSQ');
  </script>
</head>

<body>
<div class="shell">

  <header>
    <div class="brand">
      <img class="logo-img" src="assets/utter-locks-logo.jpg" alt="Utter Locks logo">
      <div>
        <h1 class="title">Utter Locks — CBB</h1>
        <p class="subtitle">College Basketball Picks</p>
      </div>
    </div>

    <div class="row">
      <a class="btn" href="index.html">← Home</a>
      <div id="adminBar" style="display:none; gap:8px;">
        <input id="file" type="file" accept=".csv" />
        <label class="btn" for="file">Preview CSV (admin)</label>
        <button class="btn" id="useRepo">Use repo data</button>
      </div>
    </div>
  </header>

  <section class="panel">
    <div class="table-wrap">
      <table id="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>Teams</th>
            <th>xSpread</th>
            <th>xTotal</th>
            <th>Spread Bet</th>
            <th>Total Bet</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>

  <footer>
    © <span id="year"></span> Utter Locks • Advice/Analysis Only
  </footer>

</div>

<script>
  const $body = document.getElementById('body');
  document.getElementById('year').textContent = new Date().getFullYear();

  const isAdmin = location.search.includes("admin=1") || location.hostname === "localhost";
  if(isAdmin) document.getElementById("adminBar").style.display = "flex";

  const CSV_OVERRIDE = new URLSearchParams(location.search).get('csv');
  const REPO_CSV = CSV_OVERRIDE ?
      new URL(CSV_OVERRIDE, location.href).toString() :
      new URL('./data/cbb_live.csv', location.href).toString();

  document.getElementById("useRepo").addEventListener("click", loadFromRepo);
  document.getElementById("file").addEventListener("change", e => {
    const f = e.target.files?.[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => render(parseCSV(ev.target.result));
    r.readAsText(f);
  });

  loadFromRepo();

  async function loadFromRepo(){
    try{
      const res = await fetch(REPO_CSV + "?v=" + Date.now());
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      render(parseCSV(await res.text()));
    }catch(err){
      $body.innerHTML = `<tr><td colspan="6" class="muted">Could not load CSV. ${err.message}</td></tr>`;
    }
  }

  /* -------- CSV PARSE -------- */
  function parseCSV(text){
    const lines = text.replace(/\r/g,'').split('\n').filter(Boolean);
    const header = lines[0].split(/\t|,/).map(h => h.trim().toLowerCase());

    const col = {
      home: header.indexOf("home"),
      away: header.indexOf("away"),
      xSpread: header.indexOf("xspread"),
      xTotal: header.indexOf("xtotal"),
      spreadBet: header.indexOf("spread bet"),
      totalBet: header.indexOf("total bet")
    };

    return lines.slice(1).map(line => {
      const cells = line.split(/\t|,/).map(c => c.trim());
      return {
        home: cells[col.home] || "",
        away: cells[col.away] || "",
        xSpread: cells[col.xSpread] || "",
        xTotal: cells[col.xTotal] || "",
        spreadBet: cells[col.spreadBet] || "",
        totalBet: cells[col.totalBet] || ""
      };
    });
  }

  /* -------- HELPERS -------- */
  function getNum(str){
    const m = str.match(/(-?\d+(\.\d+)?)/);
    return m ? Number(m[0]) : null;
  }

  function isAGradeSpread(r){
    const xs = Number(r.xSpread);
    const vegas = getNum(r.spreadBet);
    return Number.isFinite(xs) && Number.isFinite(vegas) && Math.abs(vegas - xs) <= 1.5;
  }

  function isAGradeTotal(r){
    const xt = Number(r.xTotal);
    const vegas = getNum(r.totalBet);
    return Number.isFinite(xt) && Number.isFinite(vegas) && Math.abs(vegas - xt) <= 1.5;
  }

  /* -------- RENDER -------- */
  function render(rows){
    if(!rows.length){
      $body.innerHTML = `<tr><td colspan="6" class="muted">No rows</td></tr>`;
      return;
    }

    $body.innerHTML = rows.map((r,i)=>{
      const spreadA = isAGradeSpread(r) ? "a-grade" : "";
      const totalA  = isAGradeTotal(r)  ? "a-grade" : "";

      return `
        <tr>
          <td class="num">${i+1}</td>
          <td>
            <div class="teams">
              <div class="team"><span>${r.away}</span></div>
              <div class="team"><span>${r.home}</span></div>
            </div>
          </td>
          <td class="${spreadA}">${r.xSpread || "—"}</td>
          <td class="${totalA}">${r.xTotal || "—"}</td>
          <td class="${spreadA}">${r.spreadBet || "—"}</td>
          <td class="${totalA}">${r.totalBet || "—"}</td>
        </tr>
      `;
    }).join("");
  }
</script>

</body>
</html>
