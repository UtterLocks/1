<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Utter Locks — CBB</title>
  <meta name="description" content="College Basketball Picks (Utter Locks)" />

  <link rel="preconnect" href="https://a.espncdn.com" crossorigin>
  <link rel="icon" type="image/jpeg" href="assets/utter-locks-logo.jpg" />
  <meta property="og:title" content="Utter Locks — CBB Projections">
  <meta property="og:description" content="Data-driven CBB projections & picks.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root{
      --bg:#0b1020; --bg2:#0f1730; --card:#111a36; --text:#eaf0ff; --muted:#a8b3d0;
      --brand:#7bdcff; --good:#78ffa6;
      --shadow:0 10px 30px rgba(0,0,0,.35); --radius:18px;
    }

    *{ box-sizing: border-box }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial;
      color:var(--text);
      background: radial-gradient(1200px 800px at 10% -20%, var(--bg2), transparent),
                  radial-gradient(1200px 800px at 100% 120%, var(--bg2), transparent),
                  var(--bg);
      padding:28px;
    }
    .shell{ max-width:1100px; margin:0 auto; }
    header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }

    .brand{
      display:flex; align-items:center; gap:12px; padding:10px 14px;
      border-radius: calc(var(--radius) + 6px);
      background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:var(--shadow);
    }
    .logo-img{
      display:block; width:28px; height:28px; object-fit:cover;
      border-radius:8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .title{
      margin:0; font-size:24px;
      display:inline-flex; gap:10px; align-items:center;
    }
    .title::after{
      content:""; width:10px; height:10px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, var(--brand) 30%, var(--good) 100%);
      box-shadow: 0 0 12px rgba(123,220,255,.6);
    }
    .subtitle{ margin:2px 0 0; color:var(--muted); font-size:13px }

    .panel{
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
      backdrop-filter: blur(8px);
    }

    .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap: wrap; }
    a.btn, button.btn, label.btn{
      appearance:none; cursor:pointer; border:none; text-decoration:none;
      color:var(--text); background:var(--card);
      padding:10px 14px; border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      font-weight:700; letter-spacing:.3px;
    }
    a.btn:hover, button.btn:hover, label.btn:hover{ filter:brightness(1.05) }

    #adminBar{ display:none; gap:8px; align-items:center; }
    #adminBar.show{ display:flex; }
    #file{ display:none }

    .legend{
      display:flex; flex-wrap:wrap; gap:10px 16px;
      align-items:center; color:var(--muted);
      font-size:12px; padding:6px 2px 0;
    }
    .legend span{ display:inline-flex; align-items:center; gap:6px; }

    .table-wrap{ width:100%; overflow-x:auto; -webkit-overflow-scrolling: touch; }
    table{
      width:100%; border-collapse: collapse; margin-top:12px;
      table-layout: auto; min-width: 640px;
    }
    thead th{
      position:sticky; top:0;
      background:rgba(15,23,48,.9); color:#fff;
      font-size:13px; letter-spacing:.3px;
      z-index:1;
      border-bottom: 1px solid rgba(255,255,255,.18);
    }
    th, td{
      border-bottom:1px solid rgba(255,255,255,.08);
      padding:10px; text-align:center; vertical-align: middle;
    }

    tbody tr:nth-child(odd){ background: rgba(255,255,255,.02); }
    tbody tr:hover{
      background: rgba(123,220,255,.08);
      box-shadow: inset 0 0 0 9999px rgba(123,220,255,.06);
    }

    td:nth-child(3), td:nth-child(4), th:nth-child(3), th:nth-child(4){
      font-variant-numeric: tabular-nums;
    }

    col.col-idx{ width:56px; }
    col.col-teams{ width:1%; }
    col.col-proj{ width:120px; }
    col.col-xspr{ width:110px; }
    col.col-xtot{ width:110px; }

    .teams{ display:inline-grid; grid-template-columns: 1fr; gap:6px; text-align:left; }
    .team{ display:flex; align-items:center; gap:8px; min-width: 0; }
    .team span{ display:block; white-space:nowrap; line-height:1.2; }

    .muted{ color:var(--muted) }
    .num{ white-space:nowrap; }

    .scores{
      display:grid;
      grid-auto-rows:min-content;
      gap:4px;
      justify-items:center;
      align-content:center;
      text-align:center;
    }
    .score{
      line-height:1.2;
      font-variant-numeric:tabular-nums;
    }

    @media (max-width: 780px){
      body{ padding:20px; }
      .title{ font-size:22px; }
      .subtitle{ font-size:12px; }
      th, td{ padding:8px 6px; font-size:13px; }
      .team span{ font-size:13px; }
      table{ min-width: 580px; }
    }
    @media (max-width: 560px){
      .table-wrap table{ table-layout: fixed; }
      col.col-teams{ width:46%; }
      col.col-proj{   width:96px; }
      col.col-xspr{   width:90px; }
      col.col-xtot{   width:90px; }
      th:nth-child(2), td:nth-child(2){ width:auto; }
      .team span{ white-space:normal; }
      .legend{ font-size:11px; }
    }
    @media (max-width: 520px){
      th:first-child, td:first-child{ display:none; }
      .title{ font-size:20px; }
      table{ min-width: 500px; }
      .teams{ display:grid; }
    }

    footer{ text-align:center; margin-top:14px; color:var(--muted); font-size:12px }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <img class="logo-img" src="assets/utter-locks-logo.jpg" alt="Utter Locks logo" width="28" height="28">
        <div>
          <h1 class="title">Utter Locks — CBB</h1>
          <p class="subtitle">College Basketball Picks</p>
        </div>
      </div>
      <div class="row">
        <a class="btn" href="index.html">← Home</a>
        <div id="adminBar">
          <input id="file" type="file" accept=".csv" />
          <label class="btn" for="file">Preview CSV (admin)</label>
          <button class="btn" id="useRepo">Use repo data</button>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="legend" aria-label="Legend">
        <span>A-Grade: Vegas Line − Utter Line is 1.5 or less at close</span>
      </div>

      <div class="table-wrap">
        <table id="tbl">
          <colgroup>
            <col class="col-idx">
            <col class="col-teams">
            <col class="col-proj">
            <col class="col-xspr">
            <col class="col-xtot">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Teams</th>
              <th scope="col">Proj (A-H)</th>
              <th scope="col">xSpread (A-H)</th>
              <th scope="col">xTotal</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </section>

    <footer>© <span id="year"></span> Utter Locks • Advice/analysis only</footer>
  </div>

  <script>
    const $body = document.getElementById('body');
    document.getElementById('year').textContent = new Date().getFullYear();

    const isAdmin = new URLSearchParams(location.search).get('admin') === '1' || location.hostname === 'localhost';
    if (isAdmin) document.getElementById('adminBar').classList.add('show');

    const CSV_OVERRIDE = new URLSearchParams(location.search).get('csv');
    const REPO_CSV = CSV_OVERRIDE
      ? new URL(CSV_OVERRIDE, location.href).toString()
      : new URL('./data/cbb_live.csv', location.href).toString();

    document.getElementById('useRepo').addEventListener('click', loadFromRepo);
    document.getElementById('file').addEventListener('change', (e)=>{
      const file = e.target.files?.[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => render(parseCSV(ev.target.result));
      reader.readAsText(file);
    });

    loadFromRepo();

    async function loadFromRepo(){
      try{
        const bust = Date.now();
        const url = REPO_CSV + (REPO_CSV.includes('?') ? `&v=${bust}` : `?v=${bust}`);
        const res = await fetch(url);
        if(!res.ok) throw new Error(`HTTP ${res.status} at ${url}`);
        render(parseCSV(await res.text()));
      }catch(err){
        console.error(err);
        $body.innerHTML = `<tr><td colspan="5" class="muted">Could not fetch CSV. ${err.message}.<br>Make sure the file exists at <code>${REPO_CSV}</code>.</td></tr>`;
      }
    }

    function parseCSV(text){
      const lines = text.replace(/\r/g,'').split('\n').filter(Boolean);
      if(lines.length < 2) return [];

      // First row: Null Null Home Away ... xHome xAway xSpread xTotal
      const header = lines[0].split(/\t|,/).map(h => h.trim().toLowerCase());

      const col = {
        home:    header.indexOf("home"),
        away:    header.indexOf("away"),
        xhome:   header.indexOf("xhome"),
        xaway:   header.indexOf("xaway"),
        xspread: header.indexOf("xspread"),
        xtotal:  header.indexOf("xtotal")
      };

      return lines.slice(1).map(line => {
        const cells = line.split(/\t|,/).map(c => c.trim());
        return {
          home:   col.home   >= 0 ? (cells[col.home]   || "") : "",
          away:   col.away   >= 0 ? (cells[col.away]   || "") : "",
          xHome:  col.xhome  >= 0 ? (cells[col.xhome]  || "") : "",
          xAway:  col.xaway  >= 0 ? (cells[col.xaway]  || "") : "",
          xSpread:col.xspread>= 0 ? (cells[col.xspread]|| "") : "",
          xTotal: col.xtotal >= 0 ? (cells[col.xtotal] || "") : ""
        };
      });
    }

    function n(x){
      const v = Number(x);
      return Number.isFinite(v) ? v : null;
    }

    function render(rows){
      if(!rows?.length){
        $body.innerHTML = '<tr><td colspan="5" class="muted">No rows</td></tr>';
        return;
      }

      $body.innerHTML = rows.map((r,idx)=>{
        const i = idx + 1;
        const a = r.away || "";
        const h = r.home || "";

        const xa = n(r.xAway);
        const xh = n(r.xHome);
        const xs = n(r.xSpread);
        const xt = n(r.xTotal);

        const projHTML = `
          <div class="scores">
            <div class="score">${xa != null ? xa.toFixed(1) : "—"}</div>
            <div class="score">${xh != null ? xh.toFixed(1) : "—"}</div>
          </div>
        `;

        const sprTxt = xs != null
          ? (xs > 0 ? `+${xs.toFixed(1)}` : xs.toFixed(1))
          : "—";

        const totTxt = xt != null ? xt.toFixed(1) : "—";

        return `
          <tr>
            <td class="num">${i}</td>
            <td>
              <div class="teams">
                <div class="team"><span>${a}</span></div>
                <div class="team"><span>${h}</span></div>
              </div>
            </td>
            <td>${projHTML}</td>
            <td>${sprTxt}</td>
            <td>${totTxt}</td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
